server:
  port: 8080

spring:
  application:
    name: simon-workspace-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  storage:
    active-provider: LOCAL
    providers:
      LOCAL:
        type: LOCAL
        enabled: true
        root: ${APP_FILE_STORAGE_ROOT:./data/files}
      TENCENT_COS:
        type: TENCENT_COS
        enabled: false
      ALIYUN_OSS:
        type: ALIYUN_OSS
        enabled: false
      CLOUDFLARE_R2:
        type: CLOUDFLARE_R2
        enabled: false
