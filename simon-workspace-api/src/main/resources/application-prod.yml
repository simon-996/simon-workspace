server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  storage:
    active-provider: ${APP_STORAGE_ACTIVE_PROVIDER:LOCAL}
    providers:
      LOCAL:
        type: LOCAL
        enabled: ${APP_STORAGE_LOCAL_ENABLED:true}
        root: ${APP_FILE_STORAGE_ROOT:/data/files}
        public-base-url: ${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:}
      TENCENT_COS:
        type: TENCENT_COS
        enabled: ${TENCENT_COS_ENABLED:false}
        endpoint: ${TENCENT_COS_ENDPOINT:}
        region: ${TENCENT_COS_REGION:}
        bucket: ${TENCENT_COS_BUCKET:}
        secret-id: ${TENCENT_COS_SECRET_ID:}
        secret-key: ${TENCENT_COS_SECRET_KEY:}
        public-base-url: ${TENCENT_COS_PUBLIC_BASE_URL:}
      ALIYUN_OSS:
        type: ALIYUN_OSS
        enabled: ${ALIYUN_OSS_ENABLED:false}
        endpoint: ${ALIYUN_OSS_ENDPOINT:}
        region: ${ALIYUN_OSS_REGION:}
        bucket: ${ALIYUN_OSS_BUCKET:}
        access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
        access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
        public-base-url: ${ALIYUN_OSS_PUBLIC_BASE_URL:}
      CLOUDFLARE_R2:
        type: CLOUDFLARE_R2
        enabled: ${CLOUDFLARE_R2_ENABLED:false}
        endpoint: ${CLOUDFLARE_R2_ENDPOINT:}
        account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
        bucket: ${CLOUDFLARE_R2_BUCKET:}
        access-key-id: ${CLOUDFLARE_R2_ACCESS_KEY_ID:}
        secret-access-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
        public-base-url: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:}
